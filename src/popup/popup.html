<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 翻译助手</title>
    <link rel="stylesheet" href="../styles/fonts.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- 图标精灵：统一 24x24 / 1.75 描边，颜色随 currentColor 走 -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
      <symbol id="i-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M3 12h18" />
        <path d="M12 3c2.6 2.7 2.6 15.3 0 18" />
        <path d="M12 3c-2.6 2.7-2.6 15.3 0 18" />
      </symbol>
      <symbol id="i-lines" viewBox="0 0 24 24">
        <path d="M4 6h16" />
        <path d="M4 12h11" />
        <path d="M4 18h14" />
      </symbol>
      <symbol id="i-selection" viewBox="0 0 24 24">
        <path d="M7 4H5.5A1.5 1.5 0 0 0 4 5.5V7" />
        <path d="M17 4h1.5A1.5 1.5 0 0 1 20 5.5V7" />
        <path d="M7 20H5.5A1.5 1.5 0 0 1 4 18.5V17" />
        <path d="M17 20h1.5a1.5 1.5 0 0 0 1.5-1.5V17" />
        <path d="M12 8v8" />
        <path d="M9.5 8h5" />
        <path d="M9.5 16h5" />
      </symbol>
      <symbol id="i-swap" viewBox="0 0 24 24">
        <path d="M4 8h13" />
        <path d="M14 5l3 3-3 3" />
        <path d="M20 16H7" />
        <path d="M10 13l-3 3 3 3" />
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 8h10" />
        <circle cx="17" cy="8" r="2.4" />
        <path d="M20 16H10" />
        <circle cx="7" cy="16" r="2.4" />
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24">
        <path d="M9.5 6l6 6-6 6" />
      </symbol>
    </svg>

    <div class="app">
      <header class="head">
        <img class="logo" src="../../icons/icon48.png" alt="" width="34" height="34">
        <div class="brand">
          <h1>AI 翻译助手</h1>
          <p id="status" class="status"><span class="dot"></span><span id="statusText">正在读取配置…</span></p>
        </div>
      </header>

      <div class="tabs" id="tabs" role="tablist" aria-label="功能分区">
        <button
          class="tab is-active"
          id="tab-actions"
          data-tab="actions"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-actions"
          tabindex="0"
        >
          快捷操作
        </button>
        <button
          class="tab"
          id="tab-settings"
          data-tab="settings"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-settings"
          tabindex="-1"
        >
          设置
        </button>
      </div>

      <main class="main">
        <!-- 快捷操作 -->
        <section
          class="panel is-active"
          id="panel-actions"
          data-panel="actions"
          role="tabpanel"
          aria-labelledby="tab-actions"
        >
          <button class="action" data-action="translate-page" type="button">
            <span class="action-icon" aria-hidden="true"><svg class="icon"><use href="#i-globe" /></svg></span>
            <span class="action-text">
              <strong>翻译整个页面</strong>
              <small>再次点击可恢复原文</small>
            </span>
          </button>
          <button class="action" data-action="summarize-page" type="button">
            <span class="action-icon" aria-hidden="true"><svg class="icon"><use href="#i-lines" /></svg></span>
            <span class="action-text">
              <strong>总结当前网页</strong>
              <small>提炼要点与结论</small>
            </span>
          </button>
          <button class="action" data-action="translate-selection" type="button">
            <span class="action-icon" aria-hidden="true"><svg class="icon"><use href="#i-selection" /></svg></span>
            <span class="action-text">
              <strong>翻译选中文本</strong>
              <small>先在页面上选中文字再点击</small>
            </span>
          </button>

          <div class="card">
            <div class="lang-row">
              <label class="field">
                <span class="field-label">源语言</span>
                <select id="sourceLang"></select>
              </label>
              <button
                class="ghost icon-btn"
                id="swapLang"
                type="button"
                title="交换源语言与目标语言"
                aria-label="交换源语言与目标语言"
              >
                <svg class="icon" aria-hidden="true"><use href="#i-swap" /></svg>
              </button>
              <label class="field">
                <span class="field-label">目标语言</span>
                <select id="targetLang"></select>
              </label>
            </div>
            <p class="hint" id="langHint">自动 = 中 ⇄ 英 互译：中文内容译成英文，其它语言译成中文。</p>
            <label class="switch">
              <input type="checkbox" id="autoTranslateSelection" />
              <span class="track"></span>
              <span>划词后自动翻译（无需点击按钮）</span>
            </label>
          </div>

          <p class="tip">快捷键：<kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>T</kbd> 翻译整页 · <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>S</kbd> 总结 · <kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>E</kbd> 划词翻译</p>
        </section>

        <!-- 设置 -->
        <section
          class="panel"
          id="panel-settings"
          data-panel="settings"
          role="tabpanel"
          aria-labelledby="tab-settings"
        >
          <div class="card">
            <label class="field">
              <span class="field-label">API Key</span>
              <span class="input-row">
                <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..." />
                <button class="ghost" id="toggleKey" type="button">显示</button>
              </span>
            </label>
            <label class="field">
              <span class="field-label">Base URL</span>
              <input id="baseUrl" type="text" autocomplete="off" spellcheck="false" placeholder="https://api.deepseek.com" />
            </label>
            <label class="field">
              <span class="field-label">模型</span>
              <input id="model" type="text" autocomplete="off" spellcheck="false" placeholder="deepseek-flash" />
            </label>
            <p class="hint">兼容 OpenAI 协议：可填写任意 OpenAI 兼容服务的 Key、Base URL 与模型名（如 gpt-4o-mini、deepseek-chat）。</p>
            <div class="row">
              <button class="primary" id="testBtn" type="button">测试连接</button>
              <button class="ghost" id="resetBtn" type="button">恢复默认</button>
            </div>
            <p class="result" id="testResult"></p>
          </div>

          <div class="card">
            <label class="field">
              <span class="field-label">页面翻译方式</span>
              <select id="pageMode">
                <option value="replace">替换原文</option>
                <option value="bilingual">双语对照（原文 + 译文）</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">总结详细程度</span>
              <select id="summaryLength">
                <option value="short">简短</option>
                <option value="medium">标准</option>
                <option value="detailed">详细</option>
              </select>
            </label>
            <label class="switch">
              <input type="checkbox" id="disableThinking" />
              <span class="track"></span>
              <span>关闭模型思考过程（更快、更省）</span>
            </label>
          </div>

          <p class="saved" id="savedHint">设置会自动保存</p>
        </section>
      </main>

      <footer class="foot">
        <button class="opt-link" id="openOptions" type="button">
          <svg class="icon" aria-hidden="true"><use href="#i-sliders" /></svg>
          <span class="opt-link-text">打开管理面板 · 翻译记录与 Token 统计</span>
          <svg class="icon opt-link-arrow" aria-hidden="true"><use href="#i-chevron-right" /></svg>
        </button>
      </footer>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
